data:
  train_csv:P/data/manifests/iemocap/train.csv
  val_csv: /data/manifests/iemocap/val.csv
  test_csv: /data/manifests/iemocap/test.csv
  num_classes: 4
  label_col: emotion
  text_col: text
  audio_path_col: audio_path
  video_path_col: video_path
  num_frames: 8
  frame_size: 224
  sample_rate: 16000
  max_audio_seconds: 8.0
  feature_cache_dir:/data/cache/iemocap
model:
  text_model_name: roberta-base
  audio_model_name: facebook/wav2vec2-base
  video_model_name: google/vit-base-patch16-224-in21k
  proj_dim: 256
  dropout: 0.15
  use_text: true
  use_audio: true
  use_video: true
  use_gated_fusion: true
  n_heads: 4
chado:
  backbone: ctnet
  use_causal: true
  use_hyperbolic: true
  use_ot: true
  use_mad: true
  w_causal: 0.015
  w_hyperbolic: 0.015
  w_ot: 0.008
  w_mad: 0.5
train:
  seed: 42
  epochs: 60
  batch_size_per_gpu: 16
  num_workers: 6
  lr: 1.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  amp: true
  patience: 15
  label_smoothing: 0.05
  use_class_weight: sqrt
  gradient_accumulation: 4
  prefetch_factor: 8
  persistent_workers: true
logging:
  run_name: chado_iemocap_v2
  out_dir: /experiments/results/iemocap/chado_v2
