data:
  train_csv: /data/manifests/iemocap/train.csv
  val_csv: /data/manifests/iemocap/val.csv
  test_csv:/data/manifests/iemocap/test.csv
  num_classes: 4
  max_text_len: 96
  num_frames: 8
  max_audio_seconds: 4.0
model:
  text_model_name: roberta-base
  audio_model_name: facebook/wav2vec2-base
  video_model_name: google/vit-base-patch16-224-in21k
  proj_dim: 256
  dropout: 0.18
  use_text: true
  use_audio: true
  use_video: true
  use_gated_fusion: true
  n_heads: 4
chado:
  backbone: ctnet
  n_speakers: 10
  use_causal: true
  use_hyperbolic: true
  use_ot: true
  use_mad: false
  w_causal: 0.01
  w_hyperbolic: 0.01
  w_ot: 0.005
  w_mad: 0.5
  w_speaker: 0.12
  w_turn: 0.0
  w_modal: 0.05
  w_context: 0.05
train:
  seed: 456
  epochs: 60
  batch_size_per_gpu: 8
  gradient_accumulation: 1
  num_workers: 4
  lr: 7.5e-06
  weight_decay: 0.01
  warmup_ratio: 0.12
  amp: true
  patience: 15
  label_smoothing: 0.08
  use_class_weight: sqrt
logging:
  run_name: chado_iemocap_wo_turn
  out_dir: /experiments/results/iemocap/ablations/wo_turn/seed_42
