baseline: lf_lstm
dataset: meld
data:
  train_csv: /data/processed/meld/meld_train.csv
  val_csv: /data/processed/meld/meld_val.csv
  test_csv: /data/processed/meld/meld_test.csv
  num_classes: 7
  max_text_len: 192
  num_frames: 4
  max_audio_seconds: 4.0
  sample_rate: 16000
  frame_size: 224
  text_col: text
  audio_path_col: audio_path
  video_path_col: video_path
  label_col: emotion
model:
  text_model_name: roberta-base
  audio_model_name: facebook/wav2vec2-base
  video_model_name: google/vit-base-patch16-224-in21k
  proj_dim: 256
  dropout: 0.2
  use_text: true
  use_audio: true
  use_video: true
train:
  seed: 42
  epochs: 25
  batch_size_per_gpu: 8
  num_workers: 12
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.06
  amp: true
  patience: 6
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
logging:
  run_name: lflstm_meld
  out_dir: /experiments/results/meld/lflstm
