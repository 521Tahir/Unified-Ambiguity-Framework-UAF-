data:
  train_csv: /data/manifests/meld/train.csv
  val_csv: /data/manifests/meld/val.csv
  test_csv: data/manifests/meld/test.csv
  num_classes: 7
  text_col: text
  audio_path_col: audio_path
  video_path_col: video_path
  label_col: emotion
  utt_id_col: utt_id
  context_turns: 3
  num_frames: 8
  frame_size: 224
  sample_rate: 16000
  max_audio_seconds: 6.0
model:
  text_model_name: roberta-base
  audio_model_name: facebook/wav2vec2-base
  video_model_name: google/vit-base-patch16-224-in21k
  proj_dim: 256
  dropout: 0.18
  use_text: true
  use_audio: true
  use_video: true
  use_gated_fusion: true
  n_heads: 4
chado:
  backbone: ctnet
  n_speakers: 7
  use_causal: false
  use_hyperbolic: true
  use_ot: true
  use_mad: true
  w_causal: 0.0
  w_hyperbolic: 0.01
  w_ot: 0.002
  w_mad: 0.5
  w_speaker: 0.0
  w_turn: 0.0
  w_modal: 0.0
  w_context: 0.0
  use_residual_factor: false
train:
  seed: 42
  epochs: 40
  batch_size_per_gpu: 4
  gradient_accumulation: 1
  num_workers: 4
  prefetch_factor: 8
  lr: 1.2e-05
  weight_decay: 0.02
  warmup_ratio: 0.12
  amp: true
  patience: 10
  label_smoothing: 0.1
  use_class_weight: sqrt
  cache_eval_batches: true
  find_unused_parameters: false
  ddp_static_graph: true
logging:
  run_name: meld_comp_abl_wo_causal
  out_dir: /experiments/results/meld/component_ablations/wo_causal/seed_42
